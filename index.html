<meta name="apple-mobile-web-app-title" content="Commandes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root { --fond:#f3f4f6; --carte:#fff; --texte:#111827; --gris:#6b7280; --bord:#e5e7eb;
          --accent:#ea580c; --accent-clair:#fff7ed; --vert:#16a34a; --rouge:#dc2626; --rouge-clair:#fef2f2; --sombre:#1f2937; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--fond); color:var(--texte); font-size:16px; }
  .haut-fixe { position:sticky; top:0; z-index:5; }
  header { background:var(--sombre); color:#fff;
           padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top));
           display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:15px; }
  main { padding:16px; padding-bottom:110px; max-width:700px; margin:0 auto; }
  .ecran { display:none; } .ecran.actif { display:block; }
  label.champ { display:block; margin-bottom:14px; font-weight:600; font-size:14px; color:var(--gris); }
  input, textarea { width:100%; font-size:17px; padding:12px; border:1px solid var(--bord);
                    border-radius:10px; margin-top:6px; background:#fff; color:var(--texte); font-family:inherit; }
  .grille-tables { display:grid; grid-template-columns:repeat(auto-fill,minmax(68px,1fr)); gap:10px; }
  .grille-tables button { aspect-ratio:1; font-size:22px; font-weight:700; border:2px solid var(--bord);
                          background:var(--carte); border-radius:12px; color:var(--texte); }
  .grille-tables button:active { background:var(--accent); color:#fff; }
  .onglets { display:flex; gap:8px; overflow-x:auto; padding:0 16px 10px; margin:0 -16px 6px; }
  .onglets button { flex:none; padding:10px 16px; border-radius:999px; background:var(--carte);
                    font-size:15px; font-weight:600; color:var(--texte); border:1px solid var(--bord); }
  .onglets button.actif { background:var(--sombre); color:#fff; border-color:var(--sombre); }
  .articles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .article { position:relative; background:var(--carte); border:1px solid var(--bord); border-radius:12px;
             padding:14px 12px; text-align:left; font-size:16px; font-weight:600; min-height:76px; color:var(--texte); }
  .article small { display:block; font-weight:400; color:var(--gris); margin-top:4px; }
  .article .badge { position:absolute; top:-6px; right:-6px; background:var(--accent); color:#fff;
                    border-radius:999px; min-width:26px; height:26px; font-size:14px; display:flex;
                    align-items:center; justify-content:center; padding:0 6px; }
  .article .perso { position:absolute; bottom:8px; right:10px; font-size:12px; color:var(--gris); font-weight:400; }
  .article:active { transform:scale(.97); }
  .barre { position:fixed; left:0; right:0; bottom:0; background:var(--carte); border-top:1px solid var(--bord);
           padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom)); display:flex; gap:10px; z-index:5; }
  .barre button, .gros { flex:1; font-size:17px; font-weight:700; padding:16px; border-radius:12px; border:0; }
  .principal { background:var(--accent); color:#fff; }
  .principal:disabled { opacity:.4; }
  .secondaire { background:var(--fond); color:var(--texte); flex:0 0 auto !important; }
  .danger { background:var(--rouge-clair); color:var(--rouge); flex:0 0 auto !important; }
  .ligne { background:var(--carte); border:1px solid var(--bord); border-radius:12px; padding:12px; margin-bottom:10px; }
  .ligne .haut { display:flex; align-items:center; gap:10px; }
  .ligne .nom { flex:1; font-weight:600; }
  .ligne .prix { color:var(--gris); font-size:14px; }
  .det { font-size:14px; margin-top:3px; }
  .det.opt { color:var(--sombre); } .det.ext { color:var(--vert); font-weight:600; }
  .det.ret { color:var(--rouge); font-weight:600; } .det.com { color:var(--accent); font-style:italic; }
  .qte { display:flex; align-items:center; gap:4px; }
  .qte button { width:40px; height:40px; border-radius:10px; border:1px solid var(--bord); background:var(--fond);
                font-size:22px; color:var(--texte); }
  .qte span { min-width:28px; text-align:center; font-weight:700; font-size:18px; }
  .lien { background:none; border:0; color:var(--gris); font-size:14px; padding:6px 0 0; text-decoration:underline; }
  .vide { text-align:center; color:var(--gris); padding:40px 0; }
  .titre { font-size:20px; font-weight:700; margin:4px 0 14px; }
  .total { display:flex; justify-content:space-between; font-weight:700; font-size:18px; padding:6px 4px 16px; }
  /* Fiche article */
  .modale { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:20; }
  .modale.actif { display:flex; }
  .boite { background:var(--carte); width:100%; max-width:700px; margin:0 auto; border-radius:18px 18px 0 0;
           max-height:92vh; display:flex; flex-direction:column; }
  .boite .contenu { overflow-y:auto; padding:18px 16px 8px; }
  .boite .pied { padding:12px 16px; padding-bottom:max(12px, env(safe-area-inset-bottom)); border-top:1px solid var(--bord);
                 display:flex; gap:10px; align-items:center; }
  .fiche-titre { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .fiche-titre h2 { margin:0; font-size:22px; }
  .section { margin-top:18px; }
  .section h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--gris); margin:0 0 8px; }
  .puces { display:flex; flex-wrap:wrap; gap:8px; }
  .puce { padding:11px 14px; border-radius:999px; border:1.5px solid var(--bord); background:var(--carte);
          font-size:15px; color:var(--texte); font-weight:500; }

rgines", "Feta", "Tomates confites"]}, {"nom": "Club Maison", "prix": 10, "ingredients": ["Œuf dur", "Tomate", "Concombre", "Olives", "Oignon rouge", "Sauce citronnée"]}, {"nom": "Pastrami Deli", "prix": 14, "ingredients": ["Cheddar", "Pickles", "Moutarde", "Salade"]}, {"nom": "Bagel New Yorker", "prix": 10, "ingredients": ["Cream cheese", "Concombre", "Oignons rouges"]}, {"nom": "Bagel Honey Chicken", "prix": 10, "ingredients": ["Cheddar", "Salade", "Sauce miel-moutarde"]}]}, {"nom": "Douceurs", "imprimante": "bar", "articles": [{"nom": "Croissant", "prix": 3.5}, {"nom": "Pain au chocolat", "prix": 3.5}, {"nom": "Cookie du moment", "prix": 4.5}, {"nom": "Cake marbré", "prix": 4.5}, {"nom": "Cheesecake", "prix": 5.5}, {"nom": "Banana bread", "prix": 5.5}, {"nom": "Carrot cake", "prix": 5.5}, {"nom": "Moelleux au chocolat", "prix": 5.5}, {"nom": "Brownie", "prix": 5.5}]}, {"nom": "Daily Shots", "imprimante": "bar", "groupes": ["temperature", "lait"], "articles": [{"nom": "Espresso", "prix": 2.8, "groupes": []}, {"nom": "Double espresso", "prix": 3.8, "groupes": []}, {"nom": "Americano", "prix": 3.5, "groupes": ["temperature"]}, {"nom": "Macchiato", "prix": 4}, {"nom": "Cappuccino", "prix": 5.5}, {"nom": "Latte", "prix": 5.5}, {"nom": "Flat White", "prix": 6}, {"nom": "Chocolat chaud", "prix": 5}, {"nom": "Matcha Latte", "prix": 6}, {"nom": "Chaï Latte", "prix": 6}, {"nom": "Thé / Infusion bio", "prix": 5, "groupes": ["temperature"]}, {"nom": "Soft drink", "prix": 3.5, "groupes": []}]}, {"nom": "Créations", "imprimante": "bar", "groupes": ["temperature", "lait"], "articles": [{"nom": "Ube Dream", "prix": 8}, {"nom": "Cookie Mocha", "prix": 8}, {"nom": "Pistachio Matcha", "prix": 8}, {"nom": "Lavender Vanilla", "prix": 8}, {"nom": "Pumpkin Spice Latte", "prix": 8}, {"nom": "Mango Matcha", "prix": 8}]}, {"nom": "Jus pressés", "imprimante": "bar", "articles": [{"nom": "Aube", "prix": 8}, {"nom": "Rubis", "prix": 8}, {"nom": "Verda", "prix": 8}, {"nom": "Matcha Glow", "prix": 8}, {"nom": "Tropical Vibes", "prix": 8}, {"nom": "Jus d'orange", "prix": 5}, {"nom": "Citronnade", "prix": 5}]}]};
const RESTO = "Triomfé", NB_TABLES = 30;
const NOMS_IMP = { cuisine: "Cuisine", bar: "Bar" };
const REGLAGES_DEFAUT = { cuisine: "192.168.192.50", bar: "192.168.192.50",
  protocole: location.protocol === "http:" ? "http" : "https", devid: "local_printer" };
function reglages() {
  try { return Object.assign({}, REGLAGES_DEFAUT, JSON.parse(stock.lire("reglages") || "{}")); }
  catch (e) { return Object.assign({}, REGLAGES_DEFAUT); }
}
const p2 = n => String(n).padStart(2, "0");
const jour = () => { const d = new Date(); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); };
const horodatage = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
function historique() { try { return JSON.parse(stock.lire("historique") || "[]"); } catch (e) { return []; } }
function sauverHistorique(h) {
  const limite = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  stock.ecrire("historique", JSON.stringify(h.filter(c => c.date.slice(0, 10) >= limite)));
}

/* --- ePOS-Print --- */
const xesc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const L = (s, attrs) => `<text${attrs || ""}>${xesc(s)}&#10;</text>`;
const TRAIT = "-".repeat(42);
function ticketXML(cmd, nomImp, articles, reimp) {
  let x = '<text lang="en" smooth="true"/><text align="center"/>';
  if (reimp) x += '<text em="true"/>' + L("*** REIMPRESSION ***") + '<text em="false"/>';
  x += L(nomImp.toUpperCase());
  x += '<text dw="true" dh="true"/>' + L("TABLE " + cmd.table) + '<text dw="false" dh="false"/>';
  x += L("Cmd n°" + cmd.numero + "  -  " + cmd.date.slice(8, 10) + "/" + cmd.date.slice(5, 7) + " " + cmd.date.slice(11, 16));
  x += L("Serveur : " + (cmd.serveur || "-") + (cmd.couverts ? "   Couverts : " + cmd.couverts : ""));
  x += '<text align="left"/>' + L(TRAIT);
  let cat = null;
  articles.forEach(a => {
    if (a.categorie !== cat) { cat = a.categorie; x += '<text em="true"/>' + L("[" + cat.toUpperCase() + "]") + '<text em="false"/>'; }
    x += '<text dh="true"/>' + L((a.quantite < 10 ? " " : "") + a.quantite + " x " + a.nom) + '<text dh="false"/>';
    if (a.options.length) x += '<text em="true"/>' + L("     > " + a.options.join(" / ")) + '<text em="false"/>';
    a.extras.forEach(e => { x += '<text em="true"/>' + L("     + " + e) + '<text em="false"/>'; });
    a.retraits.forEach(r => { x += '<text em="true"/>' + L("     SANS " + r.toUpperCase()) + '<text em="false"/>'; });
    if (a.note) x += L("     ! " + a.note);
  });
  if (cmd.note) x += L(TRAIT) + '<text em="true"/><text>NOTE : </text><text em="false"/>' + L(cmd.note);
  x += L(TRAIT) + '<feed line="3"/><cut type="feed"/>';
  return x;
}
async function epos(ip, corps, delai) {
  const r = reglages(); delai = delai || 10000;
  const url = `${r.protocole}://${ip}/cgi-bin/epos/service.cgi?devid=${encodeURIComponent(r.devid)}&timeout=${delai}`;
  const xml = '<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>' +
    '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' + corps + '</epos-print></s:Body></s:Envelope>';
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), delai + 4000);
  try {
    const rep = await fetch(url, { method: "POST", body: xml, signal: ctrl.signal, cache: "no-store",
      headers: { "Content-Type": "text/xml; charset=utf-8", "If-Modified-Since": "Thu, 01 Jan 1970 00:00:00 GMT", "SOAPAction": '""' } });
    const doc = new DOMParser().parseFromString(await rep.text(), "text/xml");
    const el = doc.getElementsByTagNameNS("*", "response")[0] || doc.getElementsByTagName("response")[0];
    if (!el) throw new Error("réponse illisible");
    return { succes: el.getAttribute("success") === "true", code: el.getAttribute("code") || "", statut: +el.getAttribute("status") || 0 };
  } finally { clearTimeout(t); }
}
function lireStatut(s, code) {
  const c = { EPTR_COVER_OPEN: "Capot ouvert", EPTR_REC_EMPTY: "Plus de papier !", EPTR_MECHANICAL: "Erreur mécanique",
    EPTR_AUTOCUTTER: "Erreur massicot", EPTR_UNRECOVERABLE: "Erreur imprimante", DeviceNotFound: "Nom d'imprimante (devid) incorrect",
    EX_TIMEOUT: "Imprimante occupée ou hors ligne", SchemaError: "Ticket invalide", PrintSystemError: "Erreur système imprimante" }[code];
  if (s & 0x20) return { etat: "alerte", message: "Capot ouvert" };
  if (s & 0x80000) return { etat: "alerte", message: "Plus de papier !" };
  if (s & (0x400 | 0x800 | 0x2000 | 0x4000)) return { etat: "alerte", message: "Erreur imprimante" };
  if (c) return { etat: "alerte", message: c };
  if (s & 0x20000) return { etat: "attention", message: "Papier bientôt fini" };
  return { etat: "ok", message: "Connectée" };
}
const MSG_INJOIGNABLE = "Injoignable : appareil sur le Wi-Fi L'Addition ? certificat accepté ? (voir ⚙︎)";

let cacheEtat = { t: 0, v: null };
async function etatImprimantes(force) {
  if (!force && cacheEtat.v && Date.now() - cacheEtat.t < 10000) return cacheEtat.v;
  const r = reglages(), deja = {}, res = [];
  for (const cle of Object.keys(NOMS_IMP)) {
    const ip = (r[cle] || "").trim(); let e;
    if (!ip) e = { etat: "test", message: "Mode test (pas d'IP)" };
    else if (deja[ip]) e = deja[ip];
    else {
      try { const x = await epos(ip, "", 3000); e = lireStatut(x.statut, x.succes ? "" : x.code); }
      catch (err) { e = { etat: "hors_ligne", message: MSG_INJOIGNABLE }; }
      deja[ip] = e;
    }
    res.push(Object.assign({}, e, { cle, nom: NOMS_IMP[cle], ip }));
  }
  cacheEtat = { t: Date.now(), v: res };
  return res;
}
async function imprimerCommande(cmd, reimp) {
  const r = reglages(), groupes = {}, rapport = [];
  cmd.articles.forEach(a => (groupes[a.imprimante] = groupes[a.imprimante] || []).push(a));
  for (const cle of Object.keys(groupes)) {
    const nom = NOMS_IMP[cle] || cle, ip = (r[cle] || "").trim();
    if (!ip) { rapport.push({ imprimante: nom, ok: true, test: true }); continue; }
    try {
      const x = await epos(ip, ticketXML(cmd, nom, groupes[cle], reimp), 15000);
      const s = lireStatut(x.statut, x.succes ? "" : x.code);
      if (!x.succes) rapport.push({ imprimante: nom, ok: false, erreur: nom + " : " + s.message });
      else rapport.push(Object.assign({ imprimante: nom, ok: true }, s.etat === "attention" ? { alerte: nom + " : " + s.message } : {}));
    } catch (err) {
      rapport.push({ imprimante: nom, ok: false, erreur: "Imprimante " + nom + " injoignable" });
    }
  }
  cacheEtat.v = null;
  return rapport;
}

async function api(chemin, corps) {
  if (chemin === "/api/menu") return { restaurant: RESTO, nombre_tables: NB_TABLES, groupes: MENU.groupes, categories: MENU.categories };
  if (chemin.startsWith("/api/etat")) return { imprimantes: await etatImprimantes(chemin.includes("force")), heure: new Date().toLocaleTimeString("fr-FR") };
  if (chemin === "/api/commandes") return historique().filter(c => c.date.startsWith(jour())).reverse().slice(0, 50);
  if (chemin === "/api/commande") {
    const h = historique(), nums = h.filter(c => c.date.startsWith(jour())).map(c => c.numero);
    const cmd = { numero: nums.length ? Math.max(...nums) + 1 : 1, date: horodatage(), table: String(corps.table).slice(0, 10),
      serveur: corps.serveur || "", couverts: corps.couverts, note: corps.note || "", articles: corps.articles };
    h.push(cmd); sauverHistorique(h);
    cmd.impression = await imprimerCommande(cmd);
    sauverHistorique(historique().map(c => c.numero === cmd.numero && c.date === cmd.date ? cmd : c));
    return { numero: cmd.numero, impression: cmd.impression };
  }
  if (chemin === "/api/reimprimer") {
    const c = historique().find(c => c.numero === corps.numero && c.date.startsWith(jour()));
    if (!c) throw new Error("Commande introuvable");
    return { impression: await imprimerCommande(c, true) };
  }
  throw new Error("Inconnu");
}

/* --- Réglages --- */
function ouvrirReglages() {
  const r = reglages(); fiche = null;
  const lienCert = ip => ip ? `<a href="https://${esc(ip)}" target="_blank" rel="noopener" style="color:var(--accent)">Ouvrir https://${esc(ip)}</a>` : "";
  $("boite").innerHTML = `<div class="contenu"><div class="titre">Réglages imprimantes</div>
    <label class="champ">IP imprimante Cuisine (vide = mode test)<input id="rCuisine" value="${esc(r.cuisine)}" inputmode="decimal"></label>
    <label class="champ">IP imprimante Bar<input id="rBar" value="${esc(r.bar)}" inputmode="decimal"></label>
    <label class="champ">Nom d'appareil (devid)<input id="rDevid" value="${esc(r.devid)}"></label>
    <p style="font-size:14px;color:var(--gris)">Connexion : <b>${esc(r.protocole.toUpperCase())}</b>.
    Première fois sur cet appareil : ${lienCert(r.cuisine)} dans Safari, touchez « Afficher les détails » → « visiter ce site web » pour accepter le certificat de l'imprimante, puis revenez ici.</p>
    ${r.bar && r.bar !== r.cuisine ? `<p style="font-size:14px">${lienCert(r.bar)}</p>` : ""}</div>
    <div class="pied"><button class="gros secondaire" id="rTest" style="flex:1 !important">Ticket test</button>
    <button class="gros principal" id="rOk">Enregistrer</button></div>`;
  $("modale").classList.add("actif");
  const lire = () => ({ cuisine: $("rCuisine").value.trim(), bar: $("rBar").value.trim(), devid: $("rDevid").value.trim() || "local_printer", protocole: r.protocole });
  $("rOk").onclick = () => { stock.ecrire("reglages", JSON.stringify(lire())); cacheEtat.v = null; $("modale").classList.remove("actif"); verifierEtat(true); };
  $("rTest").onclick = async () => {
    stock.ecrire("reglages", JSON.stringify(lire())); cacheEtat.v = null;
    $("rTest").textContent = "Envoi…";
    const cmd = { numero: 0, date: horodatage(), table: "TEST", serveur: $("serveur").value.trim(), note: "Ticket de test",
      articles: [{ nom: "Test impression", categorie: "Test", imprimante: "cuisine", quantite: 1, options: [], extras: [], retraits: ["oignons"], note: "accents : éèàç €" }] };
    const rap = await imprimerCommande(cmd);
    $("rTest").textContent = "Ticket test";
    toast(rap[0].ok ? (rap[0].test ? "Mode test : pas d'IP" : "✓ Ticket test imprimé") : rap[0].erreur, rap[0].ok);
  };
}
$("btnReglages").onclick = ouvrirReglages;

function demanderCode(erreur) {
  if ($("modale").classList.contains("actif") && $("codeAcces")) return;
  fiche = null;
  $("boite").innerHTML = `<div class="contenu code"><div class="titre">Code d'accès</div>
    <p style="color:var(--gris);margin-top:0">Demandez le code au responsable. Il n'est demandé qu'une fois sur ce téléphone.</p>
    ${erreur ? `<p class="imp-ko">${esc(erreur)}</p>` : ""}
    <input id="codeAcces" type="password" inputmode="numeric" autocomplete="off" maxlength="12"></div>
    <div class="pied"><button class="gros principal" id="bCode">Valider</button></div>`;
  $("modale").classList.add("actif");
  setTimeout(() => $("codeAcces") && $("codeAcces").focus(), 100);
  $("bCode").onclick = async () => {
    stock.ecrire("code", $("codeAcces").value.trim());
    $("modale").classList.remove("actif");
    try { await demarrer(); } catch (e) { if (!(e instanceof CodeRequis)) toast(e.message, false); }
  };
}

$("serveur").value = stock.lire("serveur");
$("serveur").addEventListener("input", e => stock.ecrire("serveur", e.target.value));

function toast(msg, ok, classe) {
  const t = $("toast"); t.textContent = msg; t.className = "toast " + (classe || (ok ? "ok" : "ko")); t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", ok ? 2500 : 8000);
}
$("toast").onclick = () => $("toast").style.display = "none";

/* ---------- Etat Wi-Fi / imprimantes ---------- */
let etat = { wifi: null, imprimantes: [], heure: "" };
async function verifierEtat(force) {
  try {
    const r = await api("/api/etat" + (force ? "?force=1" : ""));
    etat = { wifi: true, imprimantes: r.imprimantes, heure: r.heure };
  } catch (e) {
    if (e instanceof CodeRequis) return;
    etat.wifi = false;
  }
  rendreEtat();
}
function rendreEtat() {
  const wifiOk = etat.wifi && navigator.onLine !== false;
  $("etats").innerHTML = `<button class="etat" data-detail="1"><span class="pt ${etat.wifi === null ? "" : wifiOk ? "ok" : "ko"}"></span>Wi-Fi</button>` +
    (wifiOk ? etat.imprimantes : []).map(i => `<button class="etat" data-detail="1"><span class="pt ${i.etat}"></span>${esc(i.nom)}</button>`).join("");
  const pb = !wifiOk && etat.wifi !== null ? "Pas de réseau : vérifiez que l'appareil est sur le Wi-Fi L'Addition."
    : (etat.imprimantes.filter(i => ["alerte", "hors_ligne"].includes(i.etat)).map(i => i.nom + " : " + i.message).join(" · "));
  $("bandeau").textContent = pb; $("bandeau").classList.toggle("actif", !!pb);
}
function detailEtat() {
  const wifiOk = etat.wifi && navigator.onLine !== false;
  fiche = null;
  $("boite").innerHTML = `<div class="contenu"><div class="titre">État du système</div>
    <div class="detail-etat"><span class="pt ${wifiOk ? "ok" : "ko"}"></span><div><b>Wi-Fi</b><br>
      <small>${wifiOk ? "Appareil en ligne" : "Hors ligne : rejoignez le Wi-Fi du restaurant"}</small></div></div>
    ${etat.imprimantes.map(i => `<div class="detail-etat"><span class="pt ${i.etat}"></span><div><b>Imprimante ${esc(i.nom)}</b><br>
      <small>${esc(i.message)}${i.ip ? " · " + esc(i.ip) : ""}</small></div></div>`).join("")}
    <p style="color:var(--gris);font-size:13px">Dernière vérification : ${esc(etat.heure || "-")}</p></div>
    <div class="pied"><button class="gros secondaire" id="bFermerEtat" style="flex:1 !important">Fermer</button>
    <button class="gros principal" id="bVerifier">Vérifier maintenant</button></div>`;
  $("modale").classList.add("actif");
  $("bFermerEtat").onclick = () => $("modale").classList.remove("actif");
  $("bVerifier").onclick = async () => { $("bVerifier").textContent = "Vérification…"; await verifierEtat(true); detailEtat(); };
}
$("etats").onclick = e => { if (e.target.closest("[data-detail]")) detailEtat(); };
window.addEventListener("online", () => verifierEtat());
window.addEventListener("offline", () => { etat.wifi = false; rendreEtat(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) verifierEtat(); });
setInterval(() => { if (!document.hidden) verifierEtat(); }, 15000);

/* ---------- Navigation ---------- */
function afficher(id) {
  ecran = id;
  document.querySelectorAll(".ecran").forEach(e => e.classList.toggle("actif", e.id === id));
  $("btnRetour").style.display = id === "ecranTables" ? "none" : "";
  $("btnHistorique").style.display = id === "ecranHistorique" ? "none" : "";
  $("titre").textContent = { ecranTables: menu ? menu.restaurant : "Prise de commande",
    ecranMenu: "Table " + table, ecranPanier: "Table " + table + " – Récap", ecranHistorique: "Historique" }[id];
  if (id === "ecranMenu") rendreMenu();
  if (id === "ecranPanier") rendrePanier();
  if (id === "ecranHistorique") chargerHistorique();
  rendreBarre(); window.scrollTo(0, 0);
}
$("btnRetour").onclick = () => {
  if (ecran === "ecranPanier") afficher("ecranMenu");
  else if (ecran === "ecranHistorique") afficher(table ? "ecranMenu" : "ecranTables");
  else if (ecran === "ecranMenu") {
    if (panier.length && !confirm("Abandonner la commande en cours ?")) return;
    reinitialiser(); afficher("ecranTables");
  }
};
$("btnHistorique").onclick = () => afficher("ecranHistorique");
function reinitialiser() { panier = []; couverts = 0; table = null; $("noteGlobale").value = ""; }

const nbArticles = () => panier.reduce((s, l) => s + l.quantite, 0);
const total = () => panier.reduce((s, l) => s + prixUnitaire(l) * l.quantite, 0);

function rendreBarre() {
  const b = $("barre");
  if (ecran === "ecranTables") {
    b.innerHTML = `<button class="principal" id="bTableLibre">Valider la table</button>`;
    b.style.display = $("tableLibre").value.trim() ? "flex" : "none";
    $("bTableLibre").onclick = () => choisirTable($("tableLibre").value.trim());
  } else if (ecran === "ecranMenu") {
    b.style.display = "flex";
    b.innerHTML = `<button class="principal" ${panier.length ? "" : "disabled"} id="bVoir">Voir la commande (${nbArticles()}) · ${euros(total())}</button>`;
    $("bVoir").onclick = () => afficher("ecranPanier");
  } else if (ecran === "ecranPanier") {
    b.style.display = "flex";
    b.innerHTML = `<button class="secondaire" id="bAjout">+ Ajouter</button>
      <button class="principal" id="bEnvoyer" ${panier.length && !envoi ? "" : "disabled"}>${envoi ? "Envoi…" : "Envoyer"}</button>`;
    $("bAjout").onclick = () => afficher("ecranMenu");
    $("bEnvoyer").onclick = envoyer;
  } else b.style.display = "none";
}
$("tableLibre").addEventListener("input", rendreBarre);
function choisirTable(t) { if (!t) return; table = t; $("tableLibre").value = ""; catActive = 0; afficher("ecranMenu"); }

function rendreTables() {
  let h = ""; for (let i = 1; i <= menu.nombre_tables; i++) h += `<button data-t="${i}">${i}</button>`;
  $("grilleTables").innerHTML = h;
  $("grilleTables").onclick = e => { const t = e.target.dataset.t; if (t) choisirTable(t); };
}

/* ---------- Carte ---------- */
function groupesDe(cat, a) {
  return (a.groupes || cat.groupes || []).map(k => Object.assign({ cle: k }, menu.groupes[k])).filter(g => g.valeurs);
}
const personnalisable = (cat, a) => groupesDe(cat, a).length || (a.ingredients || []).length;

function rendreMenu() {
  $("onglets").innerHTML = menu.categories.map((c, i) =>
    `<button class="${i === catActive ? "actif" : ""}" data-i="${i}">${esc(c.nom)}</button>`).join("");
  const cat = menu.categories[catActive];
  $("articles").innerHTML = cat.articles.map((a, i) => {
    const n = panier.filter(l => l.nom === a.nom).reduce((s, l) => s + l.quantite, 0);
    return `<button class="article" data-i="${i}">${esc(a.nom)}
      ${a.prix ? `<small>${euros(a.prix)}</small>` : ""}
      ${personnalisable(cat, a) ? `<span class="perso">⚙︎</span>` : ""}
      ${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("");
}
$("onglets").onclick = e => { if (e.target.dataset.i) { catActive = +e.target.dataset.i; rendreMenu(); } };
$("articles").onclick = e => {
  const btn = e.target.closest(".article"); if (!btn) return;
  const cat = menu.categories[catActive], a = cat.articles[+btn.dataset.i];
  if (personnalisable(cat, a)) ouvrirFiche(cat, a, null);
  else { ajouterLigne(nouvelleLigne(cat, a)); }
};

/* ---------- Lignes de commande ---------- */
function nouvelleLigne(cat, a) {
  const choix = {};
  groupesDe(cat, a).forEach(g => { choix[g.cle] = g.type === "unique" && g.defaut ? [g.defaut] : []; });
  return { nom: a.nom, prixBase: a.prix || 0, categorie: cat.nom, imprimante: cat.imprimante || "cuisine",
           quantite: 1, choix, retraits: [], note: "", _cat: cat, _art: a };
}
function prixUnitaire(l) {
  let p = l.prixBase;
  groupesDe(l._cat, l._art).forEach(g => (l.choix[g.cle] || []).forEach(n => {
    const v = g.valeurs.find(v => v.nom === n); if (v && v.prix) p += v.prix;
  }));
  return p;
}
function resumer(l) {
  const options = [], extras = [];
  groupesDe(l._cat, l._art).forEach(g => (l.choix[g.cle] || []).forEach(n => {
    const v = g.valeurs.find(v => v.nom === n) || { nom: n };
    if (g.type === "multiple") extras.push(v.nom + (v.prix ? " (+" + v.prix + "€)" : ""));
    else options.push(v.nom);
  }));
  return { options, extras };
}
const signature = l => JSON.stringify([l.nom, l.choix, l.retraits.slice().sort(), l.note]);
function ajouterLigne(l) {
  const ex = panier.find(x => signature(x) === signature(l));
  if (ex) ex.quantite += l.quantite; else panier.push(l);
  if (navigator.vibrate) navigator.vibrate(15);
  rendreMenu(); rendreBarre();
}

/* ---------- Fiche article ---------- */
let fiche = null; // { ligne, index (null = nouvelle) }
function ouvrirFiche(cat, a, index) {
  const ligne = index === null ? nouvelleLigne(cat, a) : JSON.parse(JSON.stringify(panier[index], (k, v) => k[0] === "_" ? undefined : v));
  if (index !== null) { ligne._cat = panier[index]._cat; ligne._art = panier[index]._art; }
  fiche = { ligne, index };
  rendreFiche();
  $("modale").classList.add("actif");
}
function fermerFiche() { $("modale").classList.remove("actif"); fiche = null; }
$("modale").onclick = e => { if (e.target.id === "modale" && !$("codeAcces")) fermerFiche(); };

function rendreFiche() {
  const l = fiche.ligne, a = l._art;
  let h = `<div class="contenu"><div class="fiche-titre"><h2>${esc(l.nom)}</h2><span class="prix">${euros(l.prixBase)}</span></div>`;
  groupesDe(l._cat, a).forEach(g => {
    h += `<div class="section"><h3>${esc(g.titre)}${g.type === "multiple" ? " (payant)" : ""}</h3><div class="puces">` +
      g.valeurs.map(v => `<button class="puce ${(l.choix[g.cle] || []).includes(v.nom) ? "on" : ""}" data-g="${g.cle}" data-v="${esc(v.nom)}">${
        g.type === "multiple" ? "+ " : ""}${esc(v.nom)}${v.prix ? " · " + v.prix + "€" : ""}</button>`).join("") + `</div></div>`;
  });
  if ((a.ingredients || []).length) {
    h += `<div class="section"><h3>Retirer un ingrédient</h3><div class="puces">` +
      a.ingredients.map(i => `<button class="puce retire ${l.retraits.includes(i) ? "on" : ""}" data-r="${esc(i)}">${
        l.retraits.includes(i) ? "Sans " : ""}${esc(i)}</button>`).join("") + `</div></div>`;
  }
  h += `<div class="section"><h3>Commentaire / ajout</h3>
    <textarea id="ficheNote" rows="2" placeholder="ex : sauce à part, + oignons, allergie noix…">${esc(l.note)}</textarea>
    <div class="raccourcis">${RACCOURCIS.map(r => `<button data-k="${esc(r)}">${esc(r)}</button>`).join("")}</div></div></div>`;
  h += `<div class="pied">
    ${fiche.index !== null ? `<button class="gros danger" id="fSuppr">🗑</button>` : ""}
    <div class="qte"><button data-fq="-1">−</button><span>${l.quantite}</span><button data-fq="1">+</button></div>
    <button class="gros principal" id="fValider">${fiche.index !== null ? "Enregistrer" : "Ajouter"} · ${euros(prixUnitaire(l) * l.quantite)}</button></div>`;
  const scroll = $("boite").querySelector(".contenu") ? $("boite").querySelector(".contenu").scrollTop : 0;
  $("boite").innerHTML = h;
  $("boite").querySelector(".contenu").scrollTop = scroll;
}

$("boite").onclick = e => {
  if (!fiche) return;
  const l = fiche.ligne, d = e.target.dataset;
  if ($("ficheNote")) l.note = $("ficheNote").value.trim();
  if (d.g) {
    const g = menu.groupes[d.g], sel = l.choix[d.g] || (l.choix[d.g] = []);
    if (g.type === "unique") l.choix[d.g] = [d.v];
    else { const i = sel.indexOf(d.v); i >= 0 ? sel.splice(i, 1) : sel.push(d.v); }
    rendreFiche();
  } else if (d.r) {
    const i = l.retraits.indexOf(d.r); i >= 0 ? l.retraits.splice(i, 1) : l.retraits.push(d.r);
    rendreFiche();
  } else if (d.k) {
    l.note = l.note ? l.note + ", " + d.k : d.k; rendreFiche();
  } else if (d.fq) {
    l.quantite = Math.max(1, l.quantite + +d.fq); rendreFiche();
  } else if (e.target.id === "fValider") {
    if (fiche.index === null) ajouterLigne(l);
    else { panier[fiche.index] = l; rendrePanier(); rendreBarre(); }
    fermerFiche();
  } else if (e.target.id === "fSuppr") {
    panier.splice(fiche.index, 1); fermerFiche(); rendrePanier(); rendreBarre();
  }
};

/* ---------- Récapitulatif ---------- */
function rendrePanier() {
  $("couverts").textContent = couverts;
  if (!panier.length) { $("lignesPanier").innerHTML = `<div class="vide">Aucun article</div>`; return; }
  $("lignesPanier").innerHTML = panier.map((l, i) => {
    const r = resumer(l), perso = personnalisable(l._cat, l._art);
    return `<div class="ligne">
      <div class="haut">
        <span class="nom">${esc(l.nom)}<br><span class="prix">${euros(prixUnitaire(l) * l.quantite)}</span></span>
        <div class="qte"><button data-q="-1" data-i="${i}">−</button><span>${l.quantite}</span><button data-q="1" data-i="${i}">+</button></div>
      </div>
      ${r.options.length ? `<div class="det opt">${esc(r.options.join(" · "))}</div>` : ""}
      ${r.extras.map(x => `<div class="det ext">+ ${esc(x)}</div>`).join("")}
      ${l.retraits.map(x => `<div class="det ret">SANS ${esc(x)}</div>`).join("")}
      ${l.note ? `<div class="det com">« ${esc(l.note)} »</div>` : ""}
      <button class="lien" data-m="${i}">${perso ? "Modifier (extras, retirer, commentaire)" : "Ajouter un commentaire"}</button>
    </div>`;
  }).join("") + `<div class="total"><span>Total</span><span>${euros(total())}</span></div>`;
}
$("lignesPanier").onclick = e => {
  const d = e.target.dataset;
  if (d.q) {
    const l = panier[+d.i]; l.quantite += +d.q;
    if (l.quantite <= 0) panier.splice(+d.i, 1);
    rendrePanier(); rendreBarre();
  } else if (d.m !== undefined) {
    const l = panier[+d.m]; ouvrirFiche(l._cat, l._art, +d.m);
  }
};
$("zoneCouverts").onclick = e => {
  if (e.target.dataset.c) { couverts = Math.max(0, couverts + +e.target.dataset.c); $("couverts").textContent = couverts; }
};

async function envoyer() {
  if (envoi || !panier.length) return;
  envoi = true; rendreBarre();
  const articles = panier.map(l => {
    const r = resumer(l);
    return { nom: l.nom, categorie: l.categorie, imprimante: l.imprimante, quantite: l.quantite,
             prix: prixUnitaire(l), options: r.options, extras: r.extras.map(x => x.replace(/ \(\+.*\)$/, "")),
             retraits: l.retraits, note: l.note };
  });
  try {
    const res = await api("/api/commande", { table, serveur: $("serveur").value.trim(), couverts: couverts || null,
                                             note: $("noteGlobale").value.trim(), articles });
    const ko = res.impression.filter(x => !x.ok), alertes = res.impression.filter(x => x.alerte);
    const imprimees = res.impression.filter(x => x.ok).map(x => x.imprimante + (x.test ? " (test)" : "") + " ✓").join("  ");
    if (ko.length) toast("⚠ Commande n°" + res.numero + " enregistrée MAIS non imprimée : " + ko.map(x => x.erreur).join(", ") + ". Réimprimez depuis « Envoyées ».", false);
    else if (alertes.length) toast("Imprimée (n°" + res.numero + ") mais : " + alertes.map(x => x.alerte).join(", "), false, "attention");
    else toast("✓ Table " + table + " · n°" + res.numero + " — " + imprimees, true);
    reinitialiser(); envoi = false; afficher("ecranTables"); verifierEtat();
  } catch (err) {
    envoi = false; rendreBarre();
    if (err instanceof CodeRequis) return;
    etat.wifi = false; rendreEtat();
    toast("Échec de l'envoi : vérifiez le Wi-Fi. La commande n'est PAS partie, réessayez. (" + err.message + ")", false);
  }
}

/* ---------- Historique ---------- */
async function chargerHistorique() {
  $("listeHistorique").innerHTML = `<div class="vide">Chargement…</div>`;
  try {
    const cmds = await api("/api/commandes");
    $("listeHistorique").innerHTML = cmds.length ? cmds.map(c => `
      <div class="ligne hist">
        <div><b>Table ${esc(c.table)}</b> · n°${c.numero}<br>
          <small>${c.date.slice(11, 16)} · ${esc(c.serveur || "-")} · ${c.articles.reduce((s, a) => s + a.quantite, 0)} art.</small><br>
          <small>${c.articles.map(a => a.quantite + "× " + esc(a.nom)).join(", ")}</small><br>
          <small>${(c.impression || []).map(x => `<span class="${x.ok ? "imp-ok" : "imp-ko"}">${esc(x.imprimante)} ${x.ok ? "✓ imprimé" : "✗ non imprimé"}</span>`).join(" · ")}</small></div>
        <button data-r="${c.numero}">Réimprimer</button>
      </div>`).join("") : `<div class="vide">Aucune commande aujourd'hui</div>`;
  } catch (e) { $("listeHistorique").innerHTML = `<div class="vide">Impossible de charger</div>`; }
}
$("listeHistorique").onclick = async e => {
  const n = e.target.dataset.r; if (!n || !confirm("Réimprimer la commande n°" + n + " ?")) return;
  try {
    const res = await api("/api/reimprimer", { numero: +n });
    const ko = (res.impression || []).filter(x => !x.ok);
    toast(ko.length ? ko.map(x => x.erreur).join(", ") : "✓ Réimprimée", !ko.length);
  } catch (err) { if (!(err instanceof CodeRequis)) toast("Échec : vérifiez le Wi-Fi", false); }
};

async function demarrer() {
  const m = await api("/api/menu");
  menu = m; menu.groupes = menu.groupes || {};
  rendreTables(); afficher("ecranTables"); verifierEtat();
}
demarrer().catch(e => {
  if (e instanceof CodeRequis) return;
  etat.wifi = false; rendreEtat();
  toast("Erreur au démarrage : " + e.message, false);
});
</script>
</body>
</html>
